context: returns
name: Returns
intro: >-
  The common returns vocabulary -- the returns customers start, the items being sent back and the
  reasons they give -- distilled from the APIs that already exist. Refunds belong to payments and
  return labels to shipping.
tags: [Returns, Reverse Logistics, Returns Management, RMA, Exchanges, Post-Purchase, E-Commerce, Order Management, Fulfillment]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, return_id, rma_id, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, requested_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, return_status, rma_status]

concepts:
  return_request:
    path: /returns
    segments: [returns, return, return_requests, return-requests, rmas, rma, return_merchandise_authorizations]
    aliases:
      order_id: [order, order_number, original_order_id, external_order_id]
      customer_id: [customer, customer_email, email]
      reason: [return_reason, reason_code, reason_id]
      refund_amount: [refund_total, refund, amount, total]
      resolution: [outcome, return_type, type, refund_method]
      line_items: [items, return_items, return_line_items, products]
      tracking_number: [tracking, label, shipping_label]
  # return_reason was measured and dropped: 3 providers, no shared property.

duplicates:
  depict: [depictai]
  keap: [infusionsoft]
  optimizely: [zaius]
  webflow: [webflow-api-and-documentation-webflow]

findings:
  - "A return agrees on id, status and created_at across returns platforms and commerce systems.
    Returns-management tools carry items and reasons; commerce platforms record a return as a
    status on an order -- so line items and reasons fall just short of core once both count."
decisions:
  - "Returns are `/returns`; RMAs and return requests count. Exchanges do not -- in this cohort they
    were currency exchanges as often as product exchanges."
  - "The e-commerce, order-management and fulfillment tags are in the cohort: commerce platforms
    expose returns that returns-only tools do not. Refunds are payments'; return labels are
    shipping's."
  - "Return reasons were measured and dropped."
  - "Duplicates merged: four listings."
